<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1224" />
      <stop offset="50%" stop-color="#0e1b38" />
      <stop offset="100%" stop-color="#070c18" />
    </linearGradient>
    <linearGradient id="blue-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" rx="16" fill="url(#bg-grad)"/>

  <!-- Subtle Grid -->
  <g opacity="0.07" stroke="#38bdf8" stroke-width="1">
    <path d="M0 50 H800 M0 100 H800 M0 150 H800 M0 200 H800 M0 250 H800 M0 300 H800 M0 350 H800 M0 400 H800" />
    <path d="M100 0 V450 M200 0 V450 M300 0 V450 M400 0 V450 M500 0 V450 M600 0 V450 M700 0 V450" />
  </g>

  <!-- Ambient Glow Circles -->
  <circle cx="200" cy="180" r="140" fill="#38bdf8" opacity="0.08" filter="blur(40px)"/>
  <circle cx="620" cy="240" r="160" fill="#10b981" opacity="0.08" filter="blur(50px)"/>

  <!-- Window Header -->
  <g transform="translate(40, 30)">
    <rect width="720" height="390" rx="14" fill="#0d172c" stroke="rgba(148, 163, 184, 0.2)" stroke-width="1.5" filter="url(#card-shadow)"/>
    
    <!-- Title Bar -->
    <rect width="720" height="46" rx="14" fill="#13203c"/>
    <rect y="36" width="720" height="10" fill="#13203c"/>
    <line x1="0" y1="46" x2="720" y2="46" stroke="rgba(148, 163, 184, 0.15)" stroke-width="1"/>
    
    <!-- Window Dots -->
    <circle cx="24" cy="23" r="6" fill="#ef4444"/>
    <circle cx="44" cy="23" r="6" fill="#f59e0b"/>
    <circle cx="64" cy="23" r="6" fill="#10b981"/>

    <!-- App Title -->
    <text x="96" y="28" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#94a3b8">COMPLIANCE-CHECKER · MULTI-FRAMEWORK SAST ENGINE</text>
    <rect x="540" y="12" width="160" height="22" rx="6" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1"/>
    <circle cx="552" cy="23" r="4" fill="#10b981"/>
    <text x="564" y="27" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#34d399">ZERO CLOUD EGRESS</text>

    <!-- Top Metric Badges -->
    <g transform="translate(24, 66)">
      <!-- SOC 2 -->
      <g transform="translate(0, 0)">
        <rect width="155" height="64" rx="8" fill="#162447" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1"/>
        <text x="14" y="26" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#94a3b8">SOC 2 Type II</text>
        <text x="14" y="48" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#38bdf8">100% READY</text>
      </g>
      <!-- ISO 27001 -->
      <g transform="translate(172, 0)">
        <rect width="155" height="64" rx="8" fill="#162447" stroke="rgba(16, 185, 129, 0.25)" stroke-width="1"/>
        <text x="14" y="26" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#94a3b8">ISO/IEC 27001</text>
        <text x="14" y="48" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#10b981">96% PASSED</text>
      </g>
      <!-- HIPAA -->
      <g transform="translate(344, 0)">
        <rect width="155" height="64" rx="8" fill="#162447" stroke="rgba(129, 140, 248, 0.25)" stroke-width="1"/>
        <text x="14" y="26" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#94a3b8">HIPAA Security</text>
        <text x="14" y="48" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#818cf8">VERIFIED</text>
      </g>
      <!-- GDPR -->
      <g transform="translate(516, 0)">
        <rect width="155" height="64" rx="8" fill="#162447" stroke="rgba(245, 158, 11, 0.25)" stroke-width="1"/>
        <text x="14" y="26" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#94a3b8">GDPR Art. 32</text>
        <text x="14" y="48" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#fbbf24">COMPLIANT</text>
      </g>
    </g>

    <!-- SAST Code Scanner & Policy View -->
    <g transform="translate(24, 146)">
      <!-- Left Panel: SAST Terminal Scanner -->
      <rect width="410" height="220" rx="8" fill="#09101f" stroke="rgba(148, 163, 184, 0.15)" stroke-width="1"/>
      <rect width="410" height="28" rx="8" fill="#0f1a32"/>
      <rect y="20" width="410" height="8" fill="#0f1a32"/>
      <text x="14" y="19" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">AST Secret Scanner (In-Browser)</text>
      
      <text x="16" y="52" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38bdf8">✓ scan: parsing TypeScript AST in Web Worker (0ms egress)</text>
      <text x="16" y="74" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">✓ entropy_eval: High Shannon entropy detector (3.8 &gt; 3.0)</text>
      <text x="16" y="96" font-family="'JetBrains Mono', monospace" font-size="11" fill="#10b981">✓ token_check: zero hardcoded credentials detected</text>
      <text x="16" y="118" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">✓ rbac_audit: Supabase RLS row-level policies enforced</text>
      <text x="16" y="140" font-family="'JetBrains Mono', monospace" font-size="11" fill="#818cf8">✓ cors_check: strict origin validation enabled</text>
      <text x="16" y="162" font-family="'JetBrains Mono', monospace" font-size="11" fill="#10b981">✓ encryption: AES-256-GCM client-side encryption verified</text>

      <rect x="16" y="180" width="378" height="26" rx="4" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
      <text x="28" y="197" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#34d399">AUDIT SCORE: 98/100 · READY FOR AUDITOR EXPORT</text>

      <!-- Right Panel: Security Radar & Controls -->
      <g transform="translate(426, 0)">
        <rect width="246" height="220" rx="8" fill="#0e172e" stroke="rgba(148, 163, 184, 0.15)" stroke-width="1"/>
        <text x="16" y="24" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Audit Readiness Index</text>
        
        <!-- Big Score Ring -->
        <circle cx="123" cy="90" r="44" fill="none" stroke="rgba(148, 163, 184, 0.15)" stroke-width="8"/>
        <circle cx="123" cy="90" r="44" fill="none" stroke="#10b981" stroke-width="8" stroke-dasharray="276" stroke-dashoffset="18" stroke-linecap="round"/>
        <text x="123" y="94" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">98%</text>
        <text x="123" y="110" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#10b981" text-anchor="middle">COMPLIANT</text>

        <!-- Controls checklist -->
        <g transform="translate(18, 146)">
          <text x="0" y="12" font-family="'Inter', sans-serif" font-size="10" fill="#cbd5e1">🛡️ SOC2 Trust Services</text>
          <text x="175" y="12" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#10b981">PASS</text>
          
          <text x="0" y="32" font-family="'Inter', sans-serif" font-size="10" fill="#cbd5e1">🔒 Client Data Isolation</text>
          <text x="175" y="32" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#10b981">PASS</text>

          <text x="0" y="52" font-family="'Inter', sans-serif" font-size="10" fill="#cbd5e1">📋 Remediation Blueprints</text>
          <text x="168" y="52" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#38bdf8">100%</text>
        </g>
      </g>
    </g>
  </g>
</svg>
